<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>読書ハイライト間隔反復デッキ</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-indigo-950 text-gray-100 min-h-screen">

<div id="app" class="max-w-2xl mx-auto p-4">
  <h1 class="text-2xl font-bold text-center mb-1 text-indigo-300">📚 読書ハイライト 間隔反復デッキ</h1>
  <p class="text-center text-gray-400 text-sm mb-4">SM-2アルゴリズムで記憶を定着させる</p>

  <!-- Tabs -->
  <div class="flex gap-2 mb-4">
    <button onclick="showTab('review')" id="tab-review" class="tab-btn flex-1 py-2 rounded-lg bg-indigo-700 text-sm font-semibold transition">📖 今日の復習</button>
    <button onclick="showTab('add')" id="tab-add" class="tab-btn flex-1 py-2 rounded-lg bg-indigo-900 text-sm font-semibold transition">➕ 追加</button>
    <button onclick="showTab('stats')" id="tab-stats" class="tab-btn flex-1 py-2 rounded-lg bg-indigo-900 text-sm font-semibold transition">📊 統計</button>
  </div>

  <!-- Review Tab -->
  <div id="pane-review">
    <div id="no-review" class="bg-indigo-900 rounded-xl p-8 text-center hidden">
      <div class="text-5xl mb-4">🎉</div>
      <p class="text-indigo-300 font-semibold">今日の復習は完了！</p>
      <p class="text-gray-400 text-sm mt-2">次の復習カードは明日以降に表示されます</p>
    </div>

    <div id="card-container" class="hidden">
      <div class="text-sm text-gray-400 mb-2 text-center">残り <span id="remaining">0</span> 枚</div>
      <div id="flashcard" class="bg-indigo-800 rounded-xl p-6 min-h-48 cursor-pointer mb-4 transition" onclick="flipCard()">
        <div class="text-xs text-indigo-400 mb-2" id="card-book"></div>
        <div id="card-front">
          <p id="card-highlight" class="text-lg leading-relaxed"></p>
          <p class="text-sm text-indigo-400 mt-4 text-center">タップして裏面を見る</p>
        </div>
        <div id="card-back" class="hidden">
          <p class="text-sm text-indigo-400 mb-2">📝 メモ</p>
          <p id="card-memo" class="text-base leading-relaxed"></p>
          <p class="text-sm text-indigo-400 mt-4">— この内容をどのくらい覚えていましたか？</p>
        </div>
      </div>

      <div id="rating-buttons" class="hidden grid grid-cols-4 gap-2">
        <button onclick="rate(1)" class="bg-red-700 hover:bg-red-600 py-3 rounded-xl text-sm font-semibold transition">😰<br><span class="text-xs">完全に忘れた</span></button>
        <button onclick="rate(2)" class="bg-orange-700 hover:bg-orange-600 py-3 rounded-xl text-sm font-semibold transition">😕<br><span class="text-xs">うろ覚え</span></button>
        <button onclick="rate(3)" class="bg-yellow-700 hover:bg-yellow-600 py-3 rounded-xl text-sm font-semibold transition">🙂<br><span class="text-xs">なんとか</span></button>
        <button onclick="rate(4)" class="bg-green-700 hover:bg-green-600 py-3 rounded-xl text-sm font-semibold transition">😄<br><span class="text-xs">完璧</span></button>
      </div>
    </div>
  </div>

  <!-- Add Tab -->
  <div id="pane-add" class="hidden">
    <div class="bg-indigo-900 rounded-xl p-6">
      <h2 class="text-lg font-semibold mb-4 text-indigo-300">ハイライトを追加</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-gray-400 mb-1">📖 本のタイトル</label>
          <input id="book-title" type="text" class="w-full bg-indigo-800 rounded-lg p-3 text-white" placeholder="例: ファスト&スロー">
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1">🔖 ハイライト（キーセンテンス）</label>
          <textarea id="highlight-text" rows="3" class="w-full bg-indigo-800 rounded-lg p-3 text-white resize-none" placeholder="記憶したい文章・概念を入力"></textarea>
        </div>
        <div>
          <label class="block text-sm text-gray-400 mb-1">📝 メモ・自分の解釈（任意）</label>
          <textarea id="memo-text" rows="2" class="w-full bg-indigo-800 rounded-lg p-3 text-white resize-none" placeholder="自分の言葉での解釈・応用場面など"></textarea>
        </div>
        <button onclick="addCard()" class="w-full bg-indigo-500 hover:bg-indigo-400 py-3 rounded-xl font-bold transition">デッキに追加</button>
      </div>

      <div class="mt-6">
        <h3 class="text-sm text-gray-400 mb-2">登録済みカード (<span id="total-cards">0</span>枚)</h3>
        <div id="card-list" class="space-y-2 max-h-64 overflow-y-auto"></div>
      </div>
    </div>
  </div>

  <!-- Stats Tab -->
  <div id="pane-stats" class="hidden">
    <div class="bg-indigo-900 rounded-xl p-6">
      <h2 class="text-lg font-semibold mb-4 text-indigo-300">📊 記憶定着統計</h2>
      <div class="grid grid-cols-3 gap-3 mb-6">
        <div class="bg-indigo-800 rounded-xl p-4 text-center">
          <div class="text-2xl font-bold text-indigo-300" id="stat-total">0</div>
          <div class="text-xs text-gray-400">総カード数</div>
        </div>
        <div class="bg-indigo-800 rounded-xl p-4 text-center">
          <div class="text-2xl font-bold text-green-400" id="stat-mature">0</div>
          <div class="text-xs text-gray-400">成熟カード</div>
        </div>
        <div class="bg-indigo-800 rounded-xl p-4 text-center">
          <div class="text-2xl font-bold text-yellow-400" id="stat-today">0</div>
          <div class="text-xs text-gray-400">今日復習済</div>
        </div>
      </div>

      <h3 class="text-sm text-gray-400 mb-2">記憶定着曲線 (過去30日)</h3>
      <div id="curve-chart" class="bg-indigo-800 rounded-xl p-4" style="height:120px;position:relative;">
        <canvas id="curve-canvas" width="400" height="80" style="width:100%;height:80px;"></canvas>
      </div>

      <div class="mt-4 space-y-2">
        <h3 class="text-sm text-gray-400 mb-2">インターバル別カード数</h3>
        <div id="interval-dist" class="space-y-1"></div>
      </div>
    </div>
  </div>
</div>

<script>
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// SM-2 Algorithm
function sm2(card, quality) {
  // quality: 1-4 (mapping to 0-5 for SM-2 internally)
  const q = quality * 1.25; // scale to 0-5
  let { interval, repetition, efactor } = card;
  if (q < 3) {
    repetition = 0;
    interval = 1;
  } else {
    if (repetition === 0) interval = 1;
    else if (repetition === 1) interval = 6;
    else interval = Math.round(interval * efactor);
    repetition++;
  }
  efactor = Math.max(1.3, efactor + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)));
  const nextDate = new Date();
  nextDate.setDate(nextDate.getDate() + interval);
  return { interval, repetition, efactor, nextDate: nextDate.toISOString().split('T')[0] };
}

function loadDecks() {
  return JSON.parse(localStorage.getItem('srs-decks') || '[]');
}
function saveDecks(d) {
  localStorage.setItem('srs-decks', JSON.stringify(d));
}
function loadStats() {
  return JSON.parse(localStorage.getItem('srs-stats') || '{"reviewedToday":[],"todayDate":""}');
}
function saveStats(s) {
  localStorage.setItem('srs-stats', JSON.stringify(s));
}

let cards = loadDecks();
let reviewQueue = [];
let currentCard = null;
let cardFlipped = false;

function getDueCards() {
  const today = new Date().toISOString().split('T')[0];
  return cards.filter(c => c.nextDate <= today);
}

function showTab(tab) {
  ['review','add','stats'].forEach(t => {
    document.getElementById('pane-'+t).classList.add('hidden');
    document.getElementById('tab-'+t).classList.remove('bg-indigo-700');
    document.getElementById('tab-'+t).classList.add('bg-indigo-900');
  });
  document.getElementById('pane-'+tab).classList.remove('hidden');
  document.getElementById('tab-'+tab).classList.remove('bg-indigo-900');
  document.getElementById('tab-'+tab).classList.add('bg-indigo-700');

  if (tab === 'review') initReview();
  if (tab === 'add') renderCardList();
  if (tab === 'stats') renderStats();
}

function initReview() {
  reviewQueue = getDueCards();
  if (reviewQueue.length === 0) {
    document.getElementById('no-review').classList.remove('hidden');
    document.getElementById('card-container').classList.add('hidden');
  } else {
    document.getElementById('no-review').classList.add('hidden');
    document.getElementById('card-container').classList.remove('hidden');
    document.getElementById('remaining').textContent = reviewQueue.length;
    showNextCard();
  }
}

function showNextCard() {
  if (reviewQueue.length === 0) {
    document.getElementById('no-review').classList.remove('hidden');
    document.getElementById('card-container').classList.add('hidden');
    return;
  }
  currentCard = reviewQueue[0];
  cardFlipped = false;

  const bookEl = document.getElementById('card-book');
  const hlEl = document.getElementById('card-highlight');
  const memoEl = document.getElementById('card-memo');
  bookEl.textContent = '📖 ' + currentCard.book;
  hlEl.textContent = currentCard.highlight;
  memoEl.textContent = currentCard.memo || '（メモなし）';

  document.getElementById('card-front').classList.remove('hidden');
  document.getElementById('card-back').classList.add('hidden');
  document.getElementById('rating-buttons').classList.add('hidden');
  document.getElementById('remaining').textContent = reviewQueue.length;
}

function flipCard() {
  if (cardFlipped) return;
  cardFlipped = true;
  document.getElementById('card-front').classList.add('hidden');
  document.getElementById('card-back').classList.remove('hidden');
  document.getElementById('rating-buttons').classList.remove('hidden');
}

function rate(quality) {
  const idx = cards.findIndex(c => c.id === currentCard.id);
  if (idx >= 0) {
    const updated = sm2(cards[idx], quality);
    cards[idx] = { ...cards[idx], ...updated };
    saveDecks(cards);
  }
  reviewQueue.shift();

  const stats = loadStats();
  const today = new Date().toISOString().split('T')[0];
  if (stats.todayDate !== today) { stats.todayDate = today; stats.reviewedToday = []; }
  stats.reviewedToday.push(currentCard.id);
  saveStats(stats);

  showNextCard();
}

function addCard() {
  const book = document.getElementById('book-title').value.trim();
  const highlight = document.getElementById('highlight-text').value.trim();
  const memo = document.getElementById('memo-text').value.trim();
  if (!book || !highlight) { alert('本のタイトルとハイライトを入力してください'); return; }

  const today = new Date().toISOString().split('T')[0];
  const card = {
    id: Date.now().toString(),
    book, highlight, memo,
    interval: 1, repetition: 0, efactor: 2.5,
    nextDate: today
  };
  cards.push(card);
  saveDecks(cards);

  document.getElementById('book-title').value = '';
  document.getElementById('highlight-text').value = '';
  document.getElementById('memo-text').value = '';
  renderCardList();
  alert('カードを追加しました！');
}

function renderCardList() {
  document.getElementById('total-cards').textContent = cards.length;
  const list = document.getElementById('card-list');
  list.innerHTML = '';
  cards.slice().reverse().forEach(c => {
    const div = document.createElement('div');
    div.className = 'bg-indigo-800 rounded-lg p-3 text-sm flex justify-between items-start gap-2';
    const left = document.createElement('div');
    left.className = 'flex-1 min-w-0';
    const bookSpan = document.createElement('div');
    bookSpan.className = 'text-xs text-indigo-400 truncate';
    bookSpan.textContent = c.book;
    const hlSpan = document.createElement('div');
    hlSpan.className = 'text-gray-200 truncate';
    hlSpan.textContent = c.highlight.substring(0, 50) + (c.highlight.length > 50 ? '…' : '');
    left.appendChild(bookSpan);
    left.appendChild(hlSpan);
    const right = document.createElement('div');
    right.className = 'text-xs text-gray-500 whitespace-nowrap';
    right.textContent = `次: ${c.nextDate}`;
    div.appendChild(left);
    div.appendChild(right);
    list.appendChild(div);
  });
}

function renderStats() {
  const today = new Date().toISOString().split('T')[0];
  const stats = loadStats();
  const reviewedToday = stats.todayDate === today ? stats.reviewedToday.length : 0;
  const mature = cards.filter(c => c.interval >= 21).length;

  document.getElementById('stat-total').textContent = cards.length;
  document.getElementById('stat-mature').textContent = mature;
  document.getElementById('stat-today').textContent = reviewedToday;

  // Draw curve
  const canvas = document.getElementById('curve-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth || 400;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Forgetting curve simulation
  const w = canvas.width, h = canvas.height;
  ctx.strokeStyle = '#818cf8';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 0; x <= w; x++) {
    const t = x / w * 30;
    const retention = Math.exp(-0.3 * t) * 100;
    const y = h - (retention / 100 * h);
    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Review points (simulated)
  ctx.fillStyle = '#a5b4fc';
  [1, 3, 7, 14, 21].forEach(day => {
    if (day <= 30) {
      const x = day / 30 * w;
      const y = h - (Math.exp(-0.3 * day) * 100) / 100 * h;
      ctx.beginPath();
      ctx.arc(x, Math.max(5, y), 5, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // Interval distribution
  const dist = document.getElementById('interval-dist');
  dist.innerHTML = '';
  const groups = [
    { label: '新規 (1日)', min: 0, max: 2 },
    { label: '学習中 (2-6日)', min: 2, max: 7 },
    { label: '定着中 (7-20日)', min: 7, max: 21 },
    { label: '成熟 (21日以上)', min: 21, max: Infinity },
  ];
  groups.forEach(g => {
    const count = cards.filter(c => c.interval >= g.min && c.interval < g.max).length;
    const pct = cards.length ? count / cards.length * 100 : 0;
    const div = document.createElement('div');
    div.className = 'flex items-center gap-2 text-xs';
    div.innerHTML = `<span class="w-28 text-gray-400">${escHtml(g.label)}</span><div class="flex-1 bg-indigo-800 rounded h-3"><div class="bg-indigo-400 h-3 rounded" style="width:${pct}%"></div></div><span class="w-6 text-right">${count}</span>`;
    dist.appendChild(div);
  });
}

// Init
showTab('review');
</script>
</body>
</html>
